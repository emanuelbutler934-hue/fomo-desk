# Deploy the static app + data files via GitHub Actions (actions/deploy-pages).
# The desk process pushes updated data at most once every 60s; this workflow
# runs on those pushes. cancel-in-progress is false so a new push does not
# abort a deploy already in flight.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage publish tree (no .git / workflows)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub's artifact listing is eventually consistent: deploy-pages sometimes sees "0 artifacts" right after the
      # upload. Wait a moment, and retry the deploy twice before giving up.
      - name: Let the artifact settle
        run: sleep 8
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Settle before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Settle before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 25
      - id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
